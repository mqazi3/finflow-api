line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI's Depends()/Query() in default arguments is the intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

[lint.isort]
# The local alembic/ folder makes ruff think alembic is first-party; it's the installed package.
known-third-party = ["alembic"]
